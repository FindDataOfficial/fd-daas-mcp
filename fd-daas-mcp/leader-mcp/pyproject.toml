[project]
name = "leader-mcp"
version = "0.1.0"
description = "Multi-Harness Registry MCP Server + Data Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "mcp-models",
]

[project.optional-dependencies]
# CrewAI powers the DataCrew router (ask_data_crew). The gateway falls back
# to a deterministic direct router when crewai is absent, so this extra is
# optional. CrewAI requires Python <3.14 (leader-mcp is 3.11+).
# litellm enables routing to OpenAI-compatible endpoints (Volcengine ark /
# DeepSeek via LLM_BASE_URL + LLM_MODEL); without it CrewAI only supports
# its native providers (OpenAI, Anthropic, …).
crew = ["crewai", "litellm"]

[tool.setuptools]
py-modules = [
    "server",
    "database",
    "leader_database",
    "leader_crew",
    "registry_service",
    "leader_tools",
    "unified_models",
    "migrate_registry",
    "gateway_database",
    "gateway_tools",
    "data_crew",
    "seed_upstreams",
    "specialist_agents",
    "workflow_database",
    "workflow_tools",
    "seed_specialist_agents",
    "selfcheck_workflow",
]
