[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-scraw"
version = "0.1.0"
description = "Scrapers + datasource registry for Chinese central-government ministry open-information archives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cli-anything" }]
dependencies = [
    "scrapling",
    "sqlalchemy>=2.0",
]

[project.scripts]
gov-scraw = "gov_scraw.cli:main"

[tool.setuptools.packages.find]
include = ["gov_scraw*"]

[tool.setuptools.package-data]
gov_scraw = ["registry/registry.db", "registry/registry.json"]
