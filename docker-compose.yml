# cli-anything MCP servers
services:
  leader-mcp:
    build:
      context: .
      dockerfile: mcp/leader-mcp/Dockerfile
    env_file:
      - mcp/leader-mcp/.env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      - ./mcp/daas.db:/app/mcp/daas.db
    restart: unless-stopped

  akshare-mcp:
    build:
      context: .
      dockerfile: mcp/akshare-mcp/Dockerfile
    env_file:
      - mcp/akshare-mcp/.env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    restart: unless-stopped

  cron-mcp:
    build:
      context: .
      dockerfile: mcp/cron-mcp/Dockerfile
    env_file:
      - mcp/cron-mcp/.env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    volumes:
      - ./mcp/daas.db:/app/mcp/daas.db
    restart: unless-stopped
