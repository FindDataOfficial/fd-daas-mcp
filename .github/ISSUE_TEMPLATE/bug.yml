name: Bug report
description: Report something that's broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. A minimal reproducible
        example helps a lot.
  - type: input
    id: version
    attributes:
      label: fd-daas-mcp version
      description: Output of `pip show fd-daas-mcp` (the Version line)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Tool group
      description: Which group does this involve?
      options:
        - daas
        - alerts
        - cron
        - composite
        - dashboard
        - leader
        - pdf
        - research
        - cli / server (core)
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
      placeholder: |
        1. I ran `fd-daas-mcp daas list_sources`
        2. I expected ...
        3. Instead I got ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant output, stack traces, or the registration report. Paste between triple backticks.
      render: shell
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: The exact command, .mcp.json config, or env setup that reproduces the issue.
    validations:
      required: false
