# Default DAAS source configuration

sources:
  - name: akshare
    label: AKShare
    description: Chinese financial data — stocks, funds, futures, macro, bonds (673+ functions)
    url: https://github.com/akfamily/akshare
    enabled: true
    pypi_package: akshare
    import_module: akshare

  - name: worldbank
    label: World Bank
    description: World Bank Open Data — GDP, population, trade, education, health
    url: https://data.worldbank.org/
    enabled: true
    pypi_package: wbgapi
    import_module: wbgapi

  - name: ckan
    label: CKAN Open Data
    description: Open data portals — configurable portal URL
    url: https://data.gov/
    enabled: true
    pypi_package: ckanapi
    import_module: ckanapi
    config:
      portal_url: https://data.gov/api/3/

  - name: cnstats
    label: Chinese Statistics
    description: National Bureau of Statistics macro indicators
    url: https://data.stats.gov.cn/
    enabled: true
    pypi_package: akshare
    import_module: akshare
