[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraw-__SRC_DASH__"
version = "0.1.0"
description = "Scrapy crawler for __SOURCE_DESC__"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.12",
    "scrapy-redis>=0.7.3",
    "scrapyd>=1.3",
    "scrapyd-client>=1.3",
    "redis>=5",
    "pyyaml>=6.0",
]

[project.entry-points."scrapy"]
settings = "scraw___SRC_UNDERSCORE__.settings"

[project.scripts]
scraw-__SRC_DASH__ = "scraw___SRC_UNDERSCORE__.cli:main"

[tool.setuptools.packages.find]
include = ["scraw___SRC_UNDERSCORE__*"]

[tool.ruff]
line-length = 100
target-version = "py311"
