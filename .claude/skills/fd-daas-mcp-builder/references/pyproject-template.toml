[project]
name = "{{SOURCE}}-mcp"
version = "0.1.0"
description = "MCP Server for {{SOURCE_LABEL}}"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=1.0",
    {{EXTRA_DEPS}}
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
