# ============================================
# AKShare SQLite Registry — Page & Service Plan
# Generated from diagram/mcp/save-data-to-sqlite-diagram.yaml
# and schema/mcp/save-data-to-sqlite.py
#
# This is a CLI harness — "pages" map to CLI commands
# (already built in akshare_cli.py), "services" are
# the new/refactored backend modules.
# ============================================

system: akshare-sqlite-registry
description: Replace JSON registry with SQLAlchemy-backed database (SQLite default, PostgreSQL/MySQL swappable)

pages:
  - name: CLI Entry Point
    route: cli-anything-akshare
    description: |
      Existing Click CLI group — list, search, info, categories, call commands.
      Commands remain unchanged; only the backend wiring changes from
      registry.py module functions to RegistryService class.
    components:
      - type: command
        name: list
        description: List all functions or filter by category
      - type: command
        name: search
        description: Search functions by name, category, or description
      - type: command
        name: info
        description: Show function details including parameters and output columns
      - type: command
        name: categories
        description: List all categories with function counts
      - type: command
        name: call
        description: Execute an AKShare function with key=value parameters
    uses_schema:
      - Function
      - FunctionColumn
    uses_services:
      - RegistryService.listFunctions
      - RegistryService.searchFunctions
      - RegistryService.getFunctionInfo
      - RegistryService.getCategories
      - RegistryService.getCategoryFunctions
    actions:
      - name: list
        label: List Functions
      - name: search
        label: Search Functions
      - name: info
        label: Function Details
      - name: categories
        label: List Categories
      - name: call
        label: Call Function

  - name: Migration Runner
    route: scripts/migrate_registry.py
    description: |
      One-shot script that reads the existing registry.json, upserts all
      673 functions and their output columns into the SQLAlchemy database,
      then verifies the row counts match.
    components:
      - type: script
        name: migrate_registry.py
        description: Reads JSON, upserts into DB, prints verification report
    uses_schema:
      - Function
      - FunctionColumn
    uses_services:
      - MigrationRunner.run
    actions:
      - name: run
        label: Run Migration

services:
  - name: Database
    type: infrastructure
    description: |
      SQLAlchemy engine and session management. Reads DATABASE_URL env var
      (defaults to SQLite at metadata/registry.db). Auto-creates tables on
      first use. Provides session factory and lifecycle methods.
    depends_on: []
    uses_schema:
      - Function
      - FunctionColumn
    key_methods:
      - getSession
      - initDb
      - dispose

  - name: RegistryService
    type: manager
    description: |
      Replaces registry.py module-level functions with a class that queries
      the SQLAlchemy database. Takes a Session via constructor injection
      for testability. All five operations match the existing API surface
      so callers (akshare_cli.py, tests) need minimal changes.
    depends_on:
      - Database
    uses_schema:
      - Function
      - FunctionColumn
    key_methods:
      - listFunctions
      - searchFunctions
      - getFunctionInfo
      - getCategories
      - getCategoryFunctions

  - name: MigrationRunner
    type: utility
    description: |
      One-shot importer. Parses the existing registry.json, upserts each
      function (by command name) and its columns into the DB. Runs
      verification to confirm row counts match. Idempotent — safe to run
      multiple times.
    depends_on:
      - Database
    uses_schema:
      - Function
      - FunctionColumn
    key_methods:
      - run
      - parseRegistry
      - upsertFunction
      - upsertColumns
      - verify
