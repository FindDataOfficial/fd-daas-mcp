# ============================================
# AKShare SQLite Registry — Class Diagram
# Designed from goal/clear-goal/MCP/save-data-to-sqlite.md
# Replaces JSON registry with SQLAlchemy-backed storage
# ============================================

classes:
  - name: Function
    attributes:
      - visibility: "-"
        name: id
        type: int
      - visibility: "-"
        name: command
        type: String
      - visibility: "-"
        name: category
        type: String
      - visibility: "-"
        name: source
        type: String
      - visibility: "-"
        name: description
        type: String
      - visibility: "-"
        name: parameters
        type: JSON
    methods:
      - visibility: "+"
        name: toDict
        return_type: Map<String, Object>
        parameters: []

  - name: FunctionColumn
    attributes:
      - visibility: "-"
        name: id
        type: int
      - visibility: "-"
        name: functionId
        type: int
      - visibility: "-"
        name: columnName
        type: String
      - visibility: "-"
        name: columnType
        type: String
      - visibility: "-"
        name: columnDescription
        type: String
    methods:
      - visibility: "+"
        name: toDict
        return_type: Map<String, Object>
        parameters: []

  - name: Database
    attributes:
      - visibility: "-"
        name: engine
        type: Engine
      - visibility: "-"
        name: sessionFactory
        type: sessionmaker
      - visibility: "-"
        name: databaseUrl
        type: String
    methods:
      - visibility: "+"
        name: getSession
        return_type: Session
        parameters: []
      - visibility: "+"
        name: initDb
        return_type: void
        parameters: []
      - visibility: "+"
        name: dispose
        return_type: void
        parameters: []

  - name: RegistryService
    attributes:
      - visibility: "-"
        name: session
        type: Session
    methods:
      - visibility: "+"
        name: listFunctions
        return_type: Map<String, Map<String, Object>>
        parameters:
          - name: category
            type: String
      - visibility: "+"
        name: searchFunctions
        return_type: Map<String, Map<String, Object>>
        parameters:
          - name: query
            type: String
      - visibility: "+"
        name: getFunctionInfo
        return_type: Map<String, Object>
        parameters:
          - name: name
            type: String
      - visibility: "+"
        name: getCategories
        return_type: Map<String, int>
        parameters: []
      - visibility: "+"
        name: getCategoryFunctions
        return_type: Map<String, Map<String, Object>>
        parameters:
          - name: category
            type: String

  - name: MigrationRunner
    attributes:
      - visibility: "-"
        name: session
        type: Session
      - visibility: "-"
        name: registryPath
        type: String
    methods:
      - visibility: "+"
        name: run
        return_type: void
        parameters: []
      - visibility: "-"
        name: parseRegistry
        return_type: Map<String, Map<String, Object>>
        parameters: []
      - visibility: "-"
        name: upsertFunction
        return_type: void
        parameters:
          - name: command
            type: String
          - name: data
            type: Map<String, Object>
      - visibility: "-"
        name: upsertColumns
        return_type: void
        parameters:
          - name: function
            type: Function
          - name: columns
            type: List<Map<String, Object>>
      - visibility: "-"
        name: verify
        return_type: boolean
        parameters: []

# ============================================
# Relationships
# ============================================

relationships:
  - type: composition
    from: Function
    to: FunctionColumn
    label: "has"
    multiplicity:
      from: "1"
      to: "0..*"

  - type: dependency
    from: RegistryService
    to: Database
    label: "gets session from"

  - type: association
    from: RegistryService
    to: Function
    label: "queries"
    multiplicity:
      from: "1"
      to: "many"

  - type: association
    from: RegistryService
    to: FunctionColumn
    label: "queries"
    multiplicity:
      from: "1"
      to: "many"

  - type: dependency
    from: MigrationRunner
    to: Database
    label: "gets session from"

  - type: dependency
    from: MigrationRunner
    to: Function
    label: "populates"

  - type: dependency
    from: MigrationRunner
    to: FunctionColumn
    label: "populates"
