[project]
name = "daas-mcp"
version = "0.1.0"
description = "MCP server for DAAS multi-source data access"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
