[project]
name = "hkreport-mcp"
version = "0.1.0"
description = "Hong Kong stock market financial report MCP — HKEXnews filings + akshare financials, edgartools-style surface."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "akshare>=1.13",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools]
py-modules = [
    "server",
    "hkex_client",
    "financials_client",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
