[project]
name = "ckan-mcp"
version = "0.1.0"
description = "MCP Server for CKAN Open Data Portal"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "sqlalchemy>=2.0",
    "pandas>=1.0",
    "ckanapi>=4.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
